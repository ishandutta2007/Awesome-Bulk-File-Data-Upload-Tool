<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="420" preserveAspectRatio="xMidYMid meet">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#070a12" />
    </linearGradient>

    <!-- Vibrant Accents -->
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="cyanGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.2"/>
    </linearGradient>

    <linearGradient id="purpleGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0.2"/>
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="0.75" stroke-opacity="0.25" />
    </pattern>

    <!-- Filter for Glow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .title-text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      font-size: 48px;
      fill: url(#primaryGrad);
      letter-spacing: -1px;
    }
    .subtitle-text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-weight: 500;
      font-size: 20px;
      fill: #94a3b8;
    }
    .badge-pill-text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-weight: 600;
      font-size: 13px;
      fill: #e2e8f0;
    }
    
    /* Animations */
    @keyframes orbFloat1 {
      0% { transform: translate(0px, 0px) scale(1); }
      50% { transform: translate(40px, -25px) scale(1.15); }
      100% { transform: translate(0px, 0px) scale(1); }
    }
    @keyframes orbFloat2 {
      0% { transform: translate(0px, 0px) scale(1); }
      50% { transform: translate(-35px, 30px) scale(0.9); }
      100% { transform: translate(0px, 0px) scale(1); }
    }
    @keyframes dashStream {
      to { stroke-dashoffset: -100; }
    }
    @keyframes pulseGlow {
      0%, 100% { opacity: 0.3; }
      50% { opacity: 0.7; }
    }
    @keyframes cardFloat {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-8px); }
    }

    .orb-1 { animation: orbFloat1 10s ease-in-out infinite; }
    .orb-2 { animation: orbFloat2 12s ease-in-out infinite; }
    .stream-line {
      stroke-dasharray: 8, 8;
      animation: dashStream 4s linear infinite;
    }
    .pulse-glow { animation: pulseGlow 5s ease-in-out infinite; }
    .floating-card-1 { animation: cardFloat 6s ease-in-out infinite; }
    .floating-card-2 { animation: cardFloat 7s ease-in-out infinite 1s; }
    .floating-card-3 { animation: cardFloat 5.5s ease-in-out infinite 2s; }
  </style>

  <!-- Canvas Background -->
  <rect width="1200" height="420" rx="16" fill="url(#bgGradient)" />

  <!-- Animated Glowing Ambience (Behind elements) -->
  <g class="orb-1" opacity="0.45" filter="url(#glow)">
    <circle cx="220" cy="110" r="140" fill="url(#cyanGlow)" />
  </g>
  <g class="orb-2" opacity="0.35" filter="url(#glow)">
    <circle cx="980" cy="300" r="160" fill="url(#purpleGlow)" />
  </g>

  <!-- Technical Grid Overlay -->
  <rect width="1200" height="420" rx="16" fill="url(#grid)" />

  <!-- Dynamic Data Stream Vectors (Background Depth) -->
  <g opacity="0.35">
    <path class="stream-line" d="M 50 80 Q 300 20 600 80 T 1150 90" fill="none" stroke="#38bdf8" stroke-width="2" />
    <path class="stream-line" d="M 50 350 Q 400 400 750 340 T 1150 360" fill="none" stroke="#a855f7" stroke-width="2" />
    <path class="stream-line" d="M 100 220 C 400 150 800 280 1100 210" fill="none" stroke="#6366f1" stroke-width="1.5" />
  </g>

  <!-- Foreground Content: Brand & Hero Title -->
  <g transform="translate(100, 75)">
    <!-- Small Category Pill -->
    <rect x="0" y="0" width="220" height="30" rx="15" fill="#1e293b" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.6"/>
    <circle cx="16" cy="15" r="5" fill="#38bdf8" class="pulse-glow" />
    <text x="32" y="20" class="badge-pill-text" fill="#38bdf8">CURATED ECOSYSTEM 2026</text>

    <!-- Main Title (Strictly Foreground) -->
    <text x="0" y="80" class="title-text">⚡ Awesome Bulk File &amp; Data Upload</text>

    <!-- Subtitle -->
    <text x="0" y="125" class="subtitle-text">
      The definitive directory for Embeddable Importers, Resumable Protocols, ETL Pipelines &amp; Storage Transfer
    </text>
  </g>

  <!-- Feature Metric / Pillar Cards (Crisp Foreground with Subtle Float) -->
  <g transform="translate(100, 240)">
    <!-- Card 1: Embeddable CSV & Excel Importers -->
    <g class="floating-card-1" transform="translate(0, 0)">
      <rect width="310" height="110" rx="12" fill="#1e293b" fill-opacity="0.8" stroke="#334155" stroke-width="1.5" />
      <rect x="20" y="20" width="40" height="40" rx="8" fill="#0f172a" stroke="#38bdf8" stroke-width="1"/>
      <text x="40" y="46" font-size="20" text-anchor="middle" fill="#38bdf8">📊</text>
      <text x="75" y="38" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-weight="700" font-size="16" fill="#f8fafc">CSV &amp; Excel Importers</text>
      <text x="75" y="60" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" fill="#94a3b8">Flatfile · OneSchema · TableFlow</text>
      <text x="75" y="78" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" fill="#94a3b8">AI Mapping &amp; Client-Side Validation</text>
      <circle cx="285" cy="25" r="4" fill="#10b981" />
    </g>

    <!-- Card 2: Resumable Protocols & Uploader UI -->
    <g class="floating-card-2" transform="translate(345, 0)">
      <rect width="310" height="110" rx="12" fill="#1e293b" fill-opacity="0.8" stroke="#334155" stroke-width="1.5" />
      <rect x="20" y="20" width="40" height="40" rx="8" fill="#0f172a" stroke="#818cf8" stroke-width="1"/>
      <text x="40" y="46" font-size="20" text-anchor="middle" fill="#818cf8">🔄</text>
      <text x="75" y="38" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-weight="700" font-size="16" fill="#f8fafc">Resumable Protocols &amp; UI</text>
      <text x="75" y="60" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" fill="#94a3b8">Uppy · tus protocol · FilePond</text>
      <text x="75" y="78" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" fill="#94a3b8">Chunking, Pause/Resume, Multi-cloud</text>
      <circle cx="285" cy="25" r="4" fill="#38bdf8" />
    </g>

    <!-- Card 3: Automated Ingestion & Cloud Sinks -->
    <g class="floating-card-3" transform="translate(690, 0)">
      <rect width="310" height="110" rx="12" fill="#1e293b" fill-opacity="0.8" stroke="#334155" stroke-width="1.5" />
      <rect x="20" y="20" width="40" height="40" rx="8" fill="#0f172a" stroke="#c084fc" stroke-width="1"/>
      <text x="40" y="46" font-size="20" text-anchor="middle" fill="#c084fc">🚀</text>
      <text x="75" y="38" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-weight="700" font-size="16" fill="#f8fafc">Data Ingestion &amp; Storage</text>
      <text x="75" y="60" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" fill="#94a3b8">AWS S3TA · Fivetran · Rclone</text>
      <text x="75" y="78" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" fill="#94a3b8">High-Speed Object Edge Transfer</text>
      <circle cx="285" cy="25" r="4" fill="#c084fc" />
    </g>
  </g>
</svg>
